name: Build

# Every push and PR: run the tests (including the Android Auto discovery/session tests),
# build the APK and verify it. A push to main publishes a GitHub Release for the version in
# app/build.gradle.kts if that release doesn't exist yet; pushing a vX.Y.Z tag does the same
# for the tag's version. Point Obtainium at this repo to get each release on your phone.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Tag builds take their version from the tag; everything else uses app/build.gradle.kts.
      DEPTH_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      HAS_RELEASE_KEY: ${{ secrets.DEPTH_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Resolve version
        run: |
          v="$(./gradlew -q :app:printVersion)"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "Building Depth $v"

      - name: Restore release signing key
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.DEPTH_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/depth-release.jks"
          echo "DEPTH_KEYSTORE_PATH=$RUNNER_TEMP/depth-release.jks" >> "$GITHUB_ENV"

      - name: Test
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build release APK
        env:
          DEPTH_KEYSTORE_PASSWORD: ${{ secrets.DEPTH_KEYSTORE_PASSWORD }}
          DEPTH_KEY_ALIAS: ${{ secrets.DEPTH_KEY_ALIAS }}
          DEPTH_KEY_PASSWORD: ${{ secrets.DEPTH_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace
          suffix=""; [ "$HAS_RELEASE_KEY" = "true" ] || suffix="-unsigned-debugkey"
          name="Depth-${VERSION}${suffix}"
          echo "APK_NAME=$name" >> "$GITHUB_ENV"
          mkdir -p dist && cp app/build/outputs/apk/release/app-release.apk "dist/$name.apk"

      - name: Verify Android Auto declarations in the APK
        run: scripts/verify-apk.sh "dist/${APK_NAME}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_NAME }}
          path: dist/*.apk

      - name: No signing key — skipping release
        if: env.HAS_RELEASE_KEY != 'true' && github.event_name == 'push'
        run: |
          echo "::warning title=Release not published::The DEPTH_KEYSTORE_* secrets aren't set, so this APK is signed with a throwaway debug key and can't update an installed release. Add the secrets (scripts/set-ci-secrets.sh) and re-run this workflow to publish v${VERSION}."

      - name: Publish release
        # Only with the real key — a debug-signed APK can't update an installed release.
        if: env.HAS_RELEASE_KEY == 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              gh release upload "$tag" "dist/${APK_NAME}.apk" --clobber
            else
              echo "Release $tag already exists — bump the version in app/build.gradle.kts to publish a new one."
            fi
          else
            gh release create "$tag" "dist/${APK_NAME}.apk" --target "$GITHUB_SHA" \
              --title "Depth $tag" --notes-file .github/release-notes.md
          fi
